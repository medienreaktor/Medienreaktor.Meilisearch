'Neos.Neos:Node':
  properties:
    _name:
      search:
        indexing: '${node.name}'
    _removed:
      search:
        indexing: ''
    _nodeType:
      search:
        indexing: '${node.nodeTypeName}'
    __aggregateId:
      search:
        indexing: '${node.aggregateId}'
    __identifier:
      search:
        indexing: '${node.aggregateId}'
    __path:
      search:
        indexing: '${Indexing.aggregateIdPath(node)}'
    __nodeType:
      search:
        indexing: '${node.nodeTypeName}'
    __nodeTypeAndSupertypes:
      search:
        indexing: '${Indexing.extractNodeTypeNamesAndSupertypes(node)}'
    __dimensions:
      search:
        indexing: '${node.dimensionSpacePoint.coordinates}'
    __dimensionsHash:
      search:
        indexing: '${node.dimensionSpacePoint.hash}'
    __parentPath:
      search:
        indexing: '${Array.pop(Indexing.buildAllPathPrefixes(Indexing.aggregateIdPath(node)))}'
    __sortIndex:
      search:
        indexing: '${node.index}'
'Neos.Neos:Hidable':
  properties:
    _hidden:
      search:
        indexing: '${Neos.Node.isDisabled(node)}'
'Neos.Neos:Document':
  search:
    fulltext:
      isRoot: true
      enable: true
  properties:
    _hiddenInIndex:
      search:
        indexing: '${node.properties.hiddenInMenu == true}'
    title:
      search:
        fulltextExtractor: '${Indexing.extractHtmlTags(node.properties.title)}'
