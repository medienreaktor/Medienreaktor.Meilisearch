Neos:
  Flow:
    mvc:
      routes:
        Medienreaktor.Meilisearch:
          position: 'before Neos.Neos'
  Neos:
    fusion:
      autoInclude:
        Medienreaktor.Meilisearch: true
  ContentRepository:
    Search:
      defaultConfigurationPerType:
        references:
          indexing: '${Indexing.convertArrayOfNodesToArrayOfNodeIdentifiers(value)}'
      defaultContext:
        Json: Neos\Eel\Helper\JsonHelper
        AssetUri: Medienreaktor\Meilisearch\Eel\AssetUriHelper
        IndexPath: Medienreaktor\Meilisearch\Eel\IndexPathHelper
        Dimensions: Medienreaktor\Meilisearch\Eel\DimensionsHelper
  Fusion:
    defaultContext:
      IndexPath: Medienreaktor\Meilisearch\Eel\IndexPathHelper
      Dimensions: Medienreaktor\Meilisearch\Eel\DimensionsHelper
      Meilisearch: Medienreaktor\Meilisearch\Eel\MeilisearchHelper
Medienreaktor:
  Meilisearch:
    # Set to false to leave __fulltext out of the documents, e.g. when documents are
    # rendered out of band.
    enableFulltext: true
    # Attributes a document must have a non-empty value for; a node lacking one is
    # removed from the index instead.
    neededAttributesForIndex: []
    indexing:
      batchSize: 100
      maxFulltextBytes: 500000
      # How long (ms) to wait for a queued Meilisearch task. The SDK default of
      # 5000 is too short for a swap or a settings update on a large index: the
      # task still completes, but the client gives up and the command exits 1.
      taskTimeout: 300000
      # Age (seconds) after which a build index left behind by an aborted
      # nodeindex:rebuild is dropped. Younger ones may belong to a running build.
      staleBuildIndexTtl: 86400
      # Documents a node rebuild does not produce itself but that live in the same
      # index, as "label: <Meilisearch filter>". They are copied into the build
      # index before the swap, which would otherwise drop them. Packages that
      # write their own documents (e.g. the asset indexer) add their filter here.
      # Every attribute used must be in settings.filterableAttributes.
      preserveOnRebuild: {}
    client:
      endpoint: 'http://meilisearch:7700'
      apiKey: '1234'
      # Search key and its uid the Meilisearch.tenantToken() Eel helper signs tokens with
      readonlyApiKey: ''
      readonlyApiKeyUid: ''
    tenantToken:
      # Lifetime in seconds; 0 creates tokens without expiry, safe in cached output
      expiresIn: 0
    settings:
      displayedAttributes:
        - '*'
      searchableAttributes:
        - __fulltext.text
        - __fulltext.h1
        - __fulltext.h2
        - __fulltext.h3
        - __fulltext.h4
        - __fulltext.h5
        - __fulltext.h6
      # Maps, not lists: Flow merges lists by position, so packages adding entries
      # would overwrite each other. Add an attribute with `name: true`, drop one
      # with `name: false`.
      filterableAttributes:
        __identifier: true
        __dimensionsHash: true
        __path: true
        __parentPath: true
        __nodeType: true
        __nodeTypeAndSupertypes: true
        _hidden: true
        _hiddenBeforeDateTime: true
        _hiddenAfterDateTime: true
        _hiddenInIndex: true
        _geo: true
      sortableAttributes:
        _geo: true
