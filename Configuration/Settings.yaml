Neos:
  Flow:
    mvc:
      routes:
        'Medienreaktor.Meilisearch':
          position: 'before Neos.Neos'
  Neos:
    fusion:
      autoInclude:
        Medienreaktor.Meilisearch: true
  ContentRepository:
    Search:
      defaultConfigurationPerType:
        references:
          indexing: "${Indexing.convertArrayOfNodesToArrayOfNodeIdentifiers(value)}"
      defaultContext:
        Json: Neos\Eel\Helper\JsonHelper
        AssetUri: Medienreaktor\Meilisearch\Eel\AssetUriHelper
        Dimensions: Medienreaktor\Meilisearch\Eel\DimensionsHelper
  Fusion:
    defaultContext:
      Dimensions: Medienreaktor\Meilisearch\Eel\DimensionsHelper
      Meilisearch: Medienreaktor\Meilisearch\Eel\MeilisearchHelper
Medienreaktor:
  Meilisearch:
    enableFulltext: true
    neededAttributesForIndex: []
    indexing:
      # Meilisearch queues one task per write request, so this caps both the size of
      # a request and how many tasks an index run adds to the queue.
      batchSize: 1000
    client:
      endpoint: ''
      apiKey: ''
      readonlyApiKey: ''
      readonlyApiKeyUid: ''
    tenantToken:
      expiresIn: 0
    frontendFilter:
      # Whether the frontend filter excludes documents whose node is hidden in the
      # index. It is the Neos "Hide in menus" flag, which is about navigation and
      # need not mean the page should be unfindable - a site that wants those pages
      # searchable turns this off. The filter goes into the tenant token, so it is
      # enforced by Meilisearch and a client cannot widen it.
      excludeHiddenInIndex: true
    settings:
      displayedAttributes:
        - '*'
      searchableAttributes:
        - '__fulltext.text'
        - '__fulltext.h1'
        - '__fulltext.h2'
        - '__fulltext.h3'
        - '__fulltext.h4'
        - '__fulltext.h5'
        - '__fulltext.h6'
      filterableAttributes:
        - '__identifier'
        - '__dimensionsHash'
        - '__path'
        - '__parentPath'
        - '__nodeType'
        - '__nodeTypeAndSupertypes'
        - '_hidden'
        - '_hiddenBeforeDateTime'
        - '_hiddenAfterDateTime'
        - '_hiddenInIndex'
        - '_geo'
      sortableAttributes:
        - '_geo'
