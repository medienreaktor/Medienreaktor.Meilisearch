privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'Medienreaktor.Meilisearch:PublicSuggest':
      label: 'Public access to the live-search suggest endpoint'
      matcher: 'method(Medienreaktor\Meilisearch\Controller\SuggestController->suggestAction())'

roles:
  'Neos.Flow:Everybody':
    privileges:
      - privilegeTarget: 'Medienreaktor.Meilisearch:PublicSuggest'
        permission: GRANT
