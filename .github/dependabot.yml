# Standard Dependabot configuration of a medienreaktor Composer package without a
# frontend, copied unchanged from the set-up-ci skill
# (templates/package/dependabot.yml). The skill picks one of four variants: with or
# without a frontend (Dependabot fails a run when an ecosystem's directories hold no
# manifest) and with or without a Packistry dependency (Dependabot cannot
# authenticate to Packistry).
version: 2
updates:
    # The workflows pin third-party actions by commit SHA, which is the right call
    # for review but means nothing ever tells us they went stale. This does.
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      # One pull request per run rather than one per action: they are reviewed
      # together anyway, and a SHA bump carries no independent risk.
      groups:
          actions:
              patterns:
                  - "*"
      commit-message:
          prefix: "ci"

    - package-ecosystem: "composer"
      directory: "/"
      schedule:
          interval: "monthly"
      # No composer.lock is committed, so every proposal here is a constraint
      # change. `widen` adds the new range beside the old one instead of raising
      # the floor, which is what a library wants: raising it would drop consumers
      # for no reason. Narrowing stays a deliberate release decision.
      versioning-strategy: widen
      groups:
          dev-tooling:
              dependency-type: "development"
              patterns:
                  - "*"
      commit-message:
          prefix: "build"
          prefix-development: "build"
      ignore:
          # The Neos range encodes which Neos generations this package supports.
          # The CI matrix proves that range; moving it is a release decision, not
          # dependency drift. Matches nothing in a package outside Neos.
          - dependency-name: "neos/*"
          # A Studio plugin's Studio range follows the Studio release it is built
          # and type-checked against; moving it is a release decision too.
          - dependency-name: "medienreaktor/neos-studio"
          # The same for a package built on Symfony rather than Neos (FigmaTools'
          # symfony/console): the range the matrix proves, not drift.
          - dependency-name: "symfony/*"
          # A PHPUnit major changes the configuration format and the PHP floor the
          # runner needs (13 wants 8.4.1), so moving to one is a decision, not drift.
          - dependency-name: "phpunit/phpunit"
            update-types: ["version-update:semver-major"]

    # The Neos 9 line lives on the neos9 branch. Dependabot reads this file from the
    # default branch only, so a copy there would be inert: its coverage is declared
    # here, the same entries again with target-branch.
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "neos9"
      schedule:
          interval: "monthly"
      # One pull request per run rather than one per action: they are reviewed
      # together anyway, and a SHA bump carries no independent risk.
      groups:
          actions:
              patterns:
                  - "*"
      commit-message:
          prefix: "ci"

    - package-ecosystem: "composer"
      directory: "/"
      target-branch: "neos9"
      schedule:
          interval: "monthly"
      # No composer.lock is committed, so every proposal here is a constraint
      # change. `widen` adds the new range beside the old one instead of raising
      # the floor, which is what a library wants: raising it would drop consumers
      # for no reason. Narrowing stays a deliberate release decision.
      versioning-strategy: widen
      groups:
          dev-tooling:
              dependency-type: "development"
              patterns:
                  - "*"
      commit-message:
          prefix: "build"
          prefix-development: "build"
      ignore:
          # The Neos range encodes which Neos generations this package supports.
          # The CI matrix proves that range; moving it is a release decision, not
          # dependency drift. Matches nothing in a package outside Neos.
          - dependency-name: "neos/*"
          # A Studio plugin's Studio range follows the Studio release it is built
          # and type-checked against; moving it is a release decision too.
          - dependency-name: "medienreaktor/neos-studio"
          # The same for a package built on Symfony rather than Neos (FigmaTools'
          # symfony/console): the range the matrix proves, not drift.
          - dependency-name: "symfony/*"
          # A PHPUnit major changes the configuration format and the PHP floor the
          # runner needs (13 wants 8.4.1), so moving to one is a decision, not drift.
          - dependency-name: "phpunit/phpunit"
            update-types: ["version-update:semver-major"]
