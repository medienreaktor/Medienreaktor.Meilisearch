name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lets a release be re-verified without an empty commit.
  workflow_dispatch:

# Supersede a run when the same pull request branch is pushed again, but never
# cancel one on main or a manual re-verification — those exist to leave a verdict
# on a commit, and a cancelled one leaves none.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository; the token only lifts Composer's
# unauthenticated GitHub API rate limit when fetching dist archives.
permissions:
  contents: read

# Third-party actions are pinned by commit SHA rather than tag, because a tag can
# be moved onto different code after review. GitHub's own actions/* are pinned to
# the major, which GitHub controls and repoints deliberately.
env:
  # Installing Neos pulls well over a hundred packages as GitHub dist archives,
  # which exhausts the 60-per-hour unauthenticated API limit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

  # Everything neos/flow and neos/utility-unicode declare, plus what PHPUnit and
  # PHP_CodeSniffer need. ctype, filter, json, libxml, openssl, pcre, phar,
  # reflection and spl are in the default build and need no request.
  PHP_EXTENSIONS: mbstring, xml, xmlreader, xmlwriter, simplexml, dom, tokenizer, zlib

jobs:
  # Lint is deliberately not part of the test matrix below: style and static
  # analysis do not vary by PHP version here, so one authoritative run is enough.
  #
  # There is deliberately no PHPStan baseline in this repository, and no composer
  # script to generate one. An error the analysis reports is work to do, not debt to
  # be silenced in a single command.
  lint:
    name: Lint (PHP 8.3, highest deps)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Supplies both the interpreter and Composer, so nothing has to be fetched
      # from getcomposer.org at job time. The official `composer` image was the
      # alternative, but it ships exactly one PHP version and so cannot serve the
      # matrix below.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      # Installs kleisli/flow-phpstan into Build/ alongside vendor/ — it is a
      # neos-build package, so neos/composer-plugin puts it there, which is where
      # phpstan.neon.dist includes its extension.neon from.
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
          composer-options: "--prefer-dist"

      # composer validate --strict runs as part of this, as lint:composer. The
      # manifest is this package's contract with every consuming distribution, and
      # a wrong constraint there is exactly the class of bug that reaches projects
      # silently.
      - name: Run Linting (composer validate, PHPStan & PHP CodeSniffer)
        run: composer lint

  test:
    name: Test (PHP ${{ matrix.php }}, ${{ matrix.deps }} deps)
    # GitHub-hosted rather than the org's self-hosted runner: this repository is
    # public, and the org runner group is set to allows_public_repositories: false,
    # so a job from here is never claimed and sits queued indefinitely next to an
    # idle runner. GitHub-hosted minutes are free and unlimited for public repos.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # Let every version report rather than killing the rest when the first fails.
      fail-fast: false
      matrix:
        # composer.json declares php ^8.0 with neos/* ^8.3, and both ends of that
        # are exercised rather than asserted:
        #
        #   - `lowest` on 8.0 pins the oldest set the constraints permit, which is
        #     also the oldest that installs at all: Neos 8.3, meilisearch-php 1.2,
        #     content-repository-search 4.1.2, PHPUnit 9.6.
        #   - `highest` walks up to the newest Neos each interpreter permits: 8.0 and
        #     8.1 land on Neos 8.3, 8.2+ on Neos 8.4, which requires PHP >= 8.2.
        #
        # 8.5 is in: neos/flow 8.4 declares php ^8.2 and laminas/laminas-code 4.17
        # lists ~8.5.0 explicitly, so nothing in the resolved set excludes it. An
        # earlier revision of this file left it out on the claim that Neos 8.4 does
        # not support 8.5, which the constraints do not bear out. It pairs with
        # `highest` only, and always will: `lowest` deliberately pins PHPUnit 9.6
        # and dependencies that predate 8.5.
        include:
          - { php: '8.0', deps: 'lowest' }
          - { php: '8.0', deps: 'highest' }
          - { php: '8.1', deps: 'highest' }
          - { php: '8.2', deps: 'highest' }
          - { php: '8.3', deps: 'highest' }
          - { php: '8.4', deps: 'highest' }
          - { php: '8.5', deps: 'highest' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      # Resolves from the constraints every time — no composer.lock is committed,
      # which is what makes the lowest/highest split meaningful. The action caches
      # the Composer download cache per PHP version and dependency preference.
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.deps }}
          composer-options: "--prefer-dist"

      # Makes the floor claim auditable: the log states which Neos the job actually
      # ran against, rather than leaving it to be inferred from the matrix name.
      - name: Show resolved dependency versions
        run: composer show --direct

      - name: Run Tests (PHPUnit)
        run: composer test
